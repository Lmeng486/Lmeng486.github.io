.dot{width:7px;height:7px;border-radius:50%}

.date{font-size:11.5px;color:#5b6a7d}

{name:'慧慧云',added:'2026-11-09 11:21',ok:true,isNew:false,desc:'有低倍率模型；有签到，邀请好友或充值可解锁 0.4~1 元；倍率零点几。',tags:['有签到','低倍率模型','低倍率','邀请解锁'],link:'',code:'',qq:''},

{name:'TinyGate',added:'2026-11-06 11:21',ok:false,isNew:false,desc:'注册送 10 额度，低倍率，签到 0.016。',tags:['有试吃','有签到','注册送额度','低倍率'],link:'',code:'',qq:''},
{name:'晚晚舟',added:'2026-11-05 11:21',ok:true,isNew:false,desc:'注册送 1 额度，零点几倍率；有签到，邀请好友解锁固定额度；一次抽奖。',tags:['有试吃','有签到','注册送额度','低倍率','邀请解锁'],link:'',code:'',qq:''},
{name:'sheapi',added:'2026-11-04 11:21',ok:true,isNew:false,desc:'注册送 1 额度，签到 1 以内随机，低倍率。',tags:['有试吃','有签到','注册送额度','低倍率'],link:'',code:'',qq:''}
];
const STAT_UPDATED = '2026-11-21 11:52';
// ===== 数据区结束，以下不用动 =====
let curTags = new Set();
let curQ = '';
const listEl = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const statEl = document.getElementById('stat');
const qEl = document.getElementById('q');
function chipData() {
  const m = {};
  SITES.forEach(function (s) { s.tags.forEach(function (t) { m[t] = (m[t] || 0) + 1; }); });
  return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).map(function (k) { return [k, m[k]]; });
}
function renderChips() {
  chipsEl.innerHTML = '';
  chipData().forEach(function (row) {
    const t = row[0], c = row[1];
    const el = document.createElement('span');
    el.className = 'chip' + (curTags.has(t) ? ' on' : '');
    el.textContent = t + ' ' + c;
    el.onclick = function () {
      if (curTags.has(t)) { curTags.delete(t); } else { curTags.add(t); }
      renderChips(); render();
    };
    chipsEl.appendChild(el);
  });
}
function render() {
  const f = SITES.filter(function (s) {
    if (curTags.size && !s.tags.some(function (t) { return curTags.has(t); })) return false;
    if (curQ) {
      const k = (s.name + ' ' + s.desc + ' ' + s.tags.join(' ') + ' ' + (s.qq || '')).toLowerCase();
      if (k.indexOf(curQ) === -1) return false;
    }
    return true;
  });
  const okCount = SITES.filter(function (s) { return s.ok; }).length;
  statEl.innerHTML = '共 <b>' + SITES.length + '</b> 个站点 · 可访问 <b>' + okCount + '</b> · 当前显示 <b>' + f.length + '</b><br>存活状态 · ' + STAT_UPDATED + ' 更新';
  if (!f.length) {
    listEl.innerHTML = '<div class=\'empty\'>没有匹配的站点，清空筛选再试</div>';
    return;
  }
  listEl.innerHTML = f.map(function (s) {
    const linkBtn = s.link
      ? '<a class=\'btn pri\' href=\'' + s.link + '\' target=\'_blank\' rel=\'noopener\'>打开邀请链接</a>'
      : '<span class=\'btn dim\'>邀请链接待补</span>';
    const codeBtn = s.code ? '<button class=\'btn\' onclick=\'cp(\'' + s.code + '\',this)\'>复制邀请码</button>' : '';
    const qqBtn = s.qq ? '<button class=\'btn qq\' onclick=\'cp(\'' + s.qq + '\',this)\'>QQ群 ' + s.qq + '</button>' : '';
    return '<div class=\'card' + (s.ok ? '' : ' off') + '\'>'
      + '<div class=\'row1\'><span class=\'name\'>' + s.name + '</span>'
      + (s.isNew ? '<span class=\'badge\'>新站点</span>' : '')
      + '<span class=\'st\'><span class=\'dot ' + (s.ok ? 'ok' : 'bad') + '\'></span>' + (s.ok ? '可访问' : '不可访问') + '</span></div>'
      + '<div class=\'date\'>' + s.added + ' 添加</div>'
      + '<div class=\'desc\'>' + s.desc + '</div>'
      + '<div class=\'tags\'>' + s.tags.map(function (t) { return '<span class=\'t\'>#' + t + '</span>'; }).join('') + '</div>'
      + '<div class=\'actions\'>' + linkBtn + codeBtn + qqBtn + '</div>'
      + '</div>';
  }).join('');
}
function cp(v, el) {
  const done = function () { const o = el.textContent; el.textContent = '已复制'; setTimeout(function () { el.textContent = o; }, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(v).then(done).catch(function () {});
  } else {
    const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}
qEl.addEventListener('input', function (e) { curQ = e.target.value.trim().toLowerCase(); render(); });
renderChips();
render();
</script>
