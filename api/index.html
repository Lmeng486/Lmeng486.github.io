<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='theme-color' content='#faf6ee'>
<meta name='robots' content='noindex,follow'>
<link rel='canonical' href='https://lmeng486.github.io/'>
<meta http-equiv='refresh' content='0;url=https://lmeng486.github.io/'>
<title>星枢 NEXUS · 正在前往主站</title>
<meta name='description' content='本页已迁移至星枢 NEXUS 主站，正在自动跳转。'>
<style>
:root{
  --bg:#faf6ee;--paper:#fffdf8;--ink:#3a3228;--dim:#8b8073;
  --accent:#a97b46;--accent-deep:#8a5f2f;--line:#e9dfcd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.box{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:34px 26px;max-width:440px;width:100%;text-align:center;
  box-shadow:0 10px 30px rgba(58,50,40,.06);
}
.eyebrow{
  display:inline-block;font-size:11px;letter-spacing:.14em;
  color:var(--accent-deep);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;margin-bottom:18px;
}
h1{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:10px}
p{font-size:13px;color:var(--dim);line-height:1.8;margin-bottom:22px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin:0 3px;animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
a.btn{
  display:inline-block;text-decoration:none;font-size:13.5px;
  background:var(--accent);color:#fff;border-radius:10px;
  padding:11px 22px;font-weight:600;
}
a.btn:active{background:var(--accent-deep)}
.alt{margin-top:16px;font-size:11.5px;color:#b3a898;line-height:1.7}
</style>
</head>
<body>
<div class='box'>
  <div class='eyebrow'>星枢 NEXUS · API 中转站聚合</div>
  <h1>正在前往主站<span class='dot'></span><span class='dot'></span><span class='dot'></span></h1>
  <p>原「低价 API 公益导航」已并入主站，站点列表统一在主站更新。<br>若没有自动跳转，点下方按钮。</p>
  <a class='btn' href='https://lmeng486.github.io/'>前往星枢 NEXUS 主站 &nearr;</a>
  <div class='alt'>如浏览器拦截自动跳转，请手动点击上方按钮</div>
</div>
<script>
(function(){
  var T = 'https://lmeng486.github.io/';
  try { if (location.replace) { location.replace(T); } else { location.href = T; } }
  catch (e) { location.href = T; }
  setTimeout(function(){ location.href = T; }, 400);
})();
</script>
</body>
</html>
